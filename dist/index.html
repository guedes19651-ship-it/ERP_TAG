<!DOCTYPE html><html lang="pt-br"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERP TAG - Login</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#e5e5e5;font-family:"Segoe UI",Arial,sans-serif;height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}.login-box{background:#111;border:1px solid #252525;border-radius:8px;padding:40px 42px 36px;width:410px;max-width:100%;box-shadow:0 18px 55px rgba(0,0,0,.72)}.login-logo{text-align:center;margin-bottom:32px}.login-logo img{height:92px}.login-logo p{color:#d7dee5;font-size:17px;margin-top:8px;font-weight:600}.form-group{margin-bottom:24px}.form-group label{display:block;font-size:12px;color:#d7dee5;text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px}.input-wrap{position:relative}.input-wrap .input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none}.form-group input{width:100%;padding:15px 16px 15px 48px;background:#0b0b0b;border:1px solid #2a2a2a;border-radius:7px;color:#e5e5e5;font-size:16px;transition:border-color .2s,background .2s,box-shadow .2s}.form-group input:focus{outline:0;border-color:#12c6d4;box-shadow:0 0 0 3px rgba(18,198,212,.14);background:#111}.form-group input::placeholder{color:#3a3a3a}.btn-entrar{width:100%;padding:12px 16px;background:#007a8c;border:none;border-radius:8px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:10px;letter-spacing:1px;text-transform:uppercase;box-shadow:0 12px 24px rgba(0,0,0,.28)}.btn-entrar:hover{background:#009ab0;box-shadow:0 14px 28px rgba(0,0,0,.34);transform:translateY(-1px)}.btn-entrar:active{transform:translateY(0)}.msg-erro{background:#2c0a0a;border:1px solid rgba(239,68,68,.3);color:#ef4444;padding:10px 14px;border-radius:7px;font-size:13px;margin-top:14px;display:none;text-align:center}.msg-erro.visivel{display:block}.btn-entrar.carregando{opacity:.7;cursor:not-allowed}.input-senha{padding-right:42px}.btn-olho{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:0 0;border:none;cursor:pointer;color:#12c6d4;font-size:22px}.btn-admin{display:none;width:100%;margin-top:10px;padding:10px;background:0 0;border:1px solid #1a3a6e;border-radius:7px;color:#3b82f6;font-size:13px;cursor:pointer;transition:all .15s}.link-usuarios{text-align:right;margin-top:6px}.link-usuarios button{background:0 0;border:none;color:#999;font-size:12px;cursor:pointer;transition:color .2s;letter-spacing:.3px}.link-usuarios button:hover{color:#3b82f6}.popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}.popup-overlay.aberto{display:flex}.popup-usuarios{background:#111;border:1px solid #252525;border-radius:8px;padding:24px;width:320px;max-height:70vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.8);animation:popup-in .18s ease}@keyframes popup-in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}.popup-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #1a1a1a}.popup-titulo{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:#fff}.btn-fechar-popup{background:0 0;border:none;color:#555;font-size:20px;cursor:pointer;line-height:1;transition:color .15s}.btn-fechar-popup:hover{color:#ef4444}.popup-conteudo{overflow-y:auto;flex:1}.usuario-item{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:9px 12px;border-radius:6px;margin-bottom:3px;background:#111;cursor:pointer;transition:background .15s}.usuario-item:last-child{margin-bottom:0}.usuario-item:hover{background:#1a1a1a}.usuario-info-nome{font-size:12px;color:#e5e5e5;white-space:nowrap}.usuarios-loading{color:#444;font-size:12px;text-align:center;padding:12px 0}input[type=password]::-ms-clear,input[type=password]::-ms-reveal,input[type=password]::-webkit-credentials-auto-fill-button{display:none}</style><div class="login-box"><div class="login-logo"><img src="LOGO.png" alt="TAG"><p>ERP - Sistema de Gestão</div><div class="form-group" style="margin-bottom:16px"><label>Usuário</label><div class="input-wrap"><span class="input-icon">👤</span> <input type="text" id="campo-usuario" placeholder="Digite seu usuário" autocomplete="username"></div><div class="link-usuarios"><button type="button" onclick="abrirPopupUsuarios()">👥 Ver usuários cadastrados</button></div></div><div class="form-group"><label>Senha</label><div class="input-wrap"><span class="input-icon">🔒</span> <input type="password" id="campo-senha" placeholder="Digite sua senha" autocomplete="current-password" class="input-senha"> <button type="button" onclick="toggleSenha()" class="btn-olho" id="btn-olho">👁</button></div></div><button type="button" class="btn-entrar" id="btn-entrar" onclick="fazerLogin()">Entrar</button><div class="msg-erro" id="msg-erro">Usuário ou senha incorretos.</div><button type="button" id="btn-admin" class="btn-admin" onclick='window.location.href="admin-usuarios.html"'>⚙️ Gerenciar Usuários</button></div><div class="popup-overlay" id="popup-overlay" onclick="fecharSeOverlay(event)"><div class="popup-usuarios"><div class="popup-header"><span class="popup-titulo">👥 Usuários cadastrados</span> <button type="button" class="btn-fechar-popup" onclick="fecharPopupUsuarios()">×</button></div><div class="popup-conteudo"><div id="usuarios-conteudo" class="usuarios-loading">Carregando...</div></div></div></div><script src="supabase.min.js"></script><script src="erp.js"></script><script>function toggleSenha(){const e=document.getElementById("campo-senha"),o=document.getElementById("btn-olho");"password"===e.type?(e.type="text",o.style.color="#22c55e"):(e.type="password",o.style.color="#3b82f6")}function abrirPopupUsuarios(){document.getElementById("popup-overlay").classList.add("aberto")}function fecharPopupUsuarios(){document.getElementById("popup-overlay").classList.remove("aberto")}function fecharSeOverlay(e){e.target===document.getElementById("popup-overlay")&&fecharPopupUsuarios()}async function hashSenha(e){const o=(new TextEncoder).encode(e),t=await crypto.subtle.digest("SHA-256",o);return Array.from(new Uint8Array(t)).map(e=>e.toString(16).padStart(2,"0")).join("")}async function fazerLogin(){const e=document.getElementById("campo-usuario").value.trim().toUpperCase(),o=document.getElementById("campo-senha").value,t=document.getElementById("btn-entrar"),n=document.getElementById("msg-erro");if(!e||!o)return n.textContent="Preencha o usuário e a senha.",void n.classList.add("visivel");t.textContent="Verificando...",t.classList.add("carregando"),n.classList.remove("visivel");const a=await hashSenha(o),{data:r,error:s}=await db.from("usuarios").select("id, nome_usuario, nome_completo, email").eq("nome_usuario",e).eq("senha_hash",a).single();if(t.textContent="Entrar",t.classList.remove("carregando"),s||!r)return n.textContent="Usuário ou senha incorretos.",void n.classList.add("visivel");sessionStorage.setItem("erp_usuario_id",r.id),sessionStorage.setItem("erp_usuario_nome",r.nome_completo||r.nome_usuario),sessionStorage.setItem("erp_usuario_email",r.email||""),"ADMIN"===r.nome_usuario?(document.getElementById("btn-admin").style.display="block",t.textContent="Ir para Menu Principal",t.onclick=()=>window.location.href="menu.html"):window.location.href="menu.html"}async function carregarUsuarios(){const{data:e,error:o}=await db.from("usuarios").select("nome_usuario, nome_completo").order("nome_completo"),t=document.getElementById("usuarios-conteudo");o?t.textContent="Erro ao carregar.":e?.length?t.innerHTML=e.map(e=>`\n          <div class="usuario-item" onclick="selecionarUsuario('${e.nome_usuario}')" title="Clique para preencher o login">\n            <span class="usuario-info-nome">${e.nome_completo}</span>\n          </div>\n        `).join(""):t.textContent="Nenhum usuário."}function selecionarUsuario(e){document.getElementById("campo-usuario").value=e,fecharPopupUsuarios(),document.getElementById("campo-senha").focus()}document.getElementById("campo-senha").addEventListener("keydown",e=>{"Enter"===e.key&&fazerLogin()}),document.getElementById("campo-usuario").addEventListener("keydown",e=>{"Enter"===e.key&&fazerLogin()}),document.addEventListener("keydown",e=>{"Escape"===e.key&&fecharPopupUsuarios()}),carregarUsuarios()</script>
