lass="form-control" onchange="aplicarFiltros()" style="width:240px"><option value="TODOS">Todos os pedidos</select> <select id="filtro-os" class="form-control" onchange="aplicarFiltros()" style="width:210px"><option value="TODOS">Todas as O.S.</select> <select id="filtro-status" class="form-control" onchange="aplicarFiltros()" style="width:170px"><option value="TODOS">Todos os prazos<option value="CINZA">Fora da análise<option value="AMARELO">Em análise<option value="VERMELHO">Atrasado<option value="VERDE">Entregue</select> <button type="button" class="btn btn-ghost" onclick="carregarDashboard()">Atualizar</button></div></div><section class="dash-shell"><section class="table-panel"><div class="panel-title"><span>Situação detalhada dos itens</span> <span class="panel-hint" id="total-filtrado">0 itens</span></div><div class="table-wrap" id="table-wrap"><div class="empty">Carregando itens...</div></div></section></section></main><div class="toast" id="toast"></div><script src="supabase.min.js"></script><script src="erp.js"></script><script>let dados=[],filtrados=[];function mostrarToast(e,t){const a=document.getElementById("toast");a.textContent=e,a.className=`toast toast-${t} show`,setTimeout(()=>a.classList.remove("show"),4e3)}function fmt(e,t=2){return Number(e||0).toLocaleString("pt-BR",{minimumFractionDigits:t,maximumFractionDigits:t})}function fmtData(e){return e?new Date(e.getFullYear(),e.getMonth(),e.getDate()).toLocaleDateString("pt-BR"):"-"}function hojeLocal(){const e=new Date;return new Date(e.getFullYear(),e.getMonth(),e.getDate())}function parseData(e){if(!e)return null;const t=String(e).trim(),a=t.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(a)return new Date(Number(a[3]),Number(a[2])-1,Number(a[1]));const o=t.match(/^(\d{4})-(\d{2})-(\d{2})/);if(o)return new Date(Number(o[1]),Number(o[2])-1,Number(o[3]));const n=new Date(t);return Number.isNaN(n.getTime())?null:new Date(n.getFullYear(),n.getMonth(),n.getDate())}function diasEntre(e,t){return Math.round((t-e)/864e5)}function dataMaisRecente(e){const t=e.filter(Boolean);return t.length?t.reduce((e,t)=>t>e?t:e,t[0]):null}async function carregarDashboard(){document.getElementById("table-wrap").innerHTML='<div class="empty">Carregando itens...</div>';const{data:e,error:t}=await db.from("compras_pedidos_itens").select("\n      id, pedido_id, numero_os, codigo, descricao, unidade_simbolo, quantidade, data_item,\n      compras_pedidos(id, numero_pedido, fornecedor_nome, triangulacao, created_at),\n      compras_recebimentos(id, quantidade_recebida, tipo_recebimento, data_recebimento, nota_fiscal)\n    ").order("id");if(t)return mostrarToast("Erro ao carregar dashboard: "+t.message,"error"),void(document.getElementById("table-wrap").innerHTML='<div class="empty">Erro ao carregar dados.</div>');dados=(e||[]).map(processarItem),popularFiltros(),aplicarFiltros()}function processarItem(e){const t=e.compras_pedidos||{},a=e.compras_recebimentos||[],o=Number(e.quantidade||0);let n=0,d=0,i=0;const s=[],r=[],l=[];a.forEach(e=>{const t=Number(e.quantidade_recebida||0),a=parseData(e.data_recebimento);"FATURAMENTO"===e.tipo_recebimento?(d+=t,r.push(a)):"FISICO"===e.tipo_recebimento?(i+=t,l.push(a)):(n+=t,s.push(a))});const c=!!t.triangulacao,m=c?Math.min(d,i):n,u=Math.max(0,m-o),p=Math.max(0,o-m),g=o>0&&m>=o,h=dataMaisRecente(c?[dataMaisRecente(r),dataMaisRecente(l)]:s);return{id:e.id,pedidoId:t.id,pedido:t.numero_pedido||"-",fornecedor:t.fornecedor_nome||"-",triangulacao:c,os:e.numero_os||"-",codigo:e.codigo||"",descricao:e.descricao||"",unidade:e.unidade_simbolo||"",solicitado:o,recebidoNormal:n,recebidoFaturamento:d,recebidoFisico:i,entregue:m,pendente:p,excedente:u,prazo:parseData(e.data_item),dataPedido:parseData(t.created_at),dataConclusao:h,completo:g}}function calcularPrazo(e){const t=hojeLocal();if(!e.prazo)return{key:"CINZA",cls:"st-cinza",texto:"Sem prazo",inicio:null,diasRestantes:null,alertaDias:0};const a=e.dataPedido||t,o=Math.max(1,diasEntre(a,e.prazo)),n=Math.max(1,Math.ceil(20*o/100)),d=new Date(e.prazo);d.setDate(d.getDate()-n);const i=diasEntre(t,e.prazo);return e.completo?{key:"VERDE",cls:"st-verde",texto:"Entregue",inicio:d,diasRestantes:i,alertaDias:n}:t>e.prazo?{key:"VERMELHO",cls:"st-vermelho",texto:"Atrasado",inicio:d,diasRestantes:i,alertaDias:n}:t>=d?{key:"AMARELO",cls:"st-amarelo",texto:"Em análise",inicio:d,diasRestantes:i,alertaDias:n}:{key:"CINZA",cls:"st-cinza",texto:"Fora da análise",inicio:d,diasRestantes:i,alertaDias:n}}function popularFiltros(){const e=document.getElementById("filtro-pedido").value,t=document.getElementById("filtro-os").value,a=[...new Map(dados.map(e=>[String(e.pedidoId),e])).values()],o=[...new Set(dados.map(e=>e.os).filter(Boolean))].sort();document.getElementById("filtro-pedido").innerHTML='<option value="TODOS">Todos os pedidos</option>'+a.map(e=>`<option value="${e.pedidoId}">${escapeHtml(e.pedido)} - ${escapeHtml(e.fornecedor)}</option>`).join(""),document.getElementById("filtro-os").innerHTML='<option value="TODOS">Todas as O.S.</option>'+o.map(e=>`<option value="${escapeHtml(e)}">${escapeHtml(e)}</option>`).join(""),[...document.getElementById("filtro-pedido").options].some(t=>t.value===e)&&(document.getElementById("filtro-pedido").value=e),[...document.getElementById("filtro-os").options].some(e=>e.value===t)&&(document.getElementById("filtro-os").value=t)}function aplicarFiltros(){const e=document.getElementById("filtro-pedido").value,t=document.getElementById("filtro-os").value,a=document.getElementById("filtro-status").value;filtrados=dados.map(e=>({...e,prazoInfo:calcularPrazo(e)})).filter(o=>("TODOS"===e||String(o.pedidoId)===e)&&(("TODOS"===t||o.os===t)&&("TODOS"===a||o.prazoInfo.key===a))),renderTabela()}function renderTabela(){document.getElementById("total-filtrado").textContent=`${filtrados.length} itens`;const e=document.getElementById("table-wrap");filtrados.length?e.innerHTML=`\n    <table>\n      <thead>\n        <tr>\n          <th style="width:85px;">Pedido</th>\n          <th style="width:90px;">O.S.</th>\n          <th style="width:130px;">Fornecedor</th>\n          <th style="width:85px;">Tipo</th>\n          <th style="width:330px;">Item</th>\n          <th style="width:75px;">Pedido</th>\n          <th style="width:85px;">Entregue</th>\n          <th style="width:85px;">Pendente</th>\n          <th style="width:95px;">Prazo</th>\n          <th style="width:105px;">Início análise</th>\n          <th style="width:85px;">Dias</th>\n          <th style="width:140px;">Situação</th>\n        </tr>\n      </thead>\n      <tbody>\n        ${filtrados.map(e=>{const t=e.prazoInfo;return`\n            <tr>\n              <td class="num-cell">${escapeHtml(e.pedido)}</td>\n              <td class="num-cell">${escapeHtml(e.os)}</td>\n              <td>${escapeHtml(e.fornecedor)}</td>\n              <td><span class="badge ${e.triangulacao?"tipo-tri":"tipo-normal"}">${e.triangulacao?"Triang.":"Normal"}</span></td>\n              <td class="text-left"><span class="produto-codigo">${escapeHtml(e.codigo||"-")}</span><br><span class="produto-desc">${escapeHtml(e.descricao)}</span></td>\n              <td class="num-cell">${fmt(e.solicitado,1)} ${escapeHtml(e.unidade)}</td>\n              <td class="num-cell">${fmt(e.entregue,1)} ${escapeHtml(e.unidade)}</td>\n              <td class="num-cell" style="color:${e.pendente>0?"#fbbf24":"#4ade80"};">${fmt(e.pendente,1)} ${escapeHtml(e.unidade)}</td>\n              <td class="num-cell">${fmtData(e.prazo)}</td>\n              <td class="num-cell">${fmtData(t.inicio)}</td>\n              <td class="num-cell">${null===t.diasRestantes?"-":t.diasRestantes}</td>\n              <td><span class="badge ${t.cls}">${escapeHtml(t.texto)}</span></td>\n            </tr>`}).join("")}\n      </tbody>\n    </table>`:e.innerHTML='<div class="empty">Nenhum item encontrado com os filtros atuais.</div>'}function escapeHtml(e){return String(e??"").replace(/[&<>"']/g,e=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[e]))}sessionStorage.getItem("erp_usuario_id")?(document.getElementById("nome-usuario").textContent=sessionStorage.getItem("erp_usuario_nome")||"",carregarDashboard())</script>
