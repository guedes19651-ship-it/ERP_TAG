<!DOCTYPE html><html lang="pt-br"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estoque - Histórico | ERP TAG</title><link rel="stylesheet" href="erp.css"><style>.toast{position:fixed;bottom:20px;right:20px;padding:10px 18px;border-radius:8px;font-size:13px;color:#fff;z-index:999;opacity:0;transform:translateY(8px);transition:all .3s}.toast.show{opacity:1;transform:translateY(0)}.toast-success{background:#166534;border:1px solid #22c55e}.toast-error{background:#7f1d1d;border:1px solid #ef4444}body,html{height:100%;margin:0;padding:0;overflow:hidden}body{display:flex;flex-direction:column;background:#0a0a0a}main{flex:1;min-height:0;display:flex;flex-direction:column;padding:72px 20px 16px;box-sizing:border-box;gap:12px}.filtros-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#111;border:1px solid #1e1e1e;border-radius:8px;padding:10px 14px;flex-shrink:0}.filtros-bar label{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#fff;margin-right:2px;white-space:nowrap}.filtros-bar .filtro-grupo{display:flex;align-items:center;gap:6px}.input-filtro{padding:7px 11px;background:#141e22;border:1px solid #1e5060;border-radius:5px;color:#fff;font-size:12px}.input-filtro:focus{outline:0;border-color:#00b4cc;box-shadow:0 0 0 2px rgba(0,122,140,.2)}.input-filtro::placeholder{color:#3a6a70}select.input-filtro{cursor:pointer}select.input-filtro option{background:#111}.input-filtro-busca{width:220px}.input-filtro-data{width:140px}#filtro-ate::-webkit-calendar-picker-indicator,#filtro-de::-webkit-calendar-picker-indicator{opacity:0}.input-filtro-tipo{width:130px}.input-filtro-local{width:110px}.btn{padding:6px 14px;border:none;border-radius:5px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}.btn-teal{background:#007a8c;color:#fff}.btn-teal:hover{background:#009ab0}.btn-ghost{background:0 0;color:#aaa;border:1px solid #333}.btn-ghost:hover{border-color:#555;color:#fff}.divisor{width:1px;height:22px;background:#2a2a2a;flex-shrink:0}.filtros-acoes{margin-left:auto;display:flex;gap:8px}.totais-bar{display:flex;gap:16px;align-items:center;flex-shrink:0}.total-chip{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600}.total-entradas{background:#0b1f12;border:1px solid #1a3a22;color:#4db870}.total-saidas{background:#1f0b0b;border:1px solid #3a1a1a;color:#e05050}.total-registros{background:#111;border:1px solid #222;color:#888}.total-num{font-size:15px;font-weight:700;margin-left:2px}.tabela-wrap{flex:1;min-height:0;overflow-y:auto;background:#111;border:1px solid #1e1e1e;border-radius:8px}.tabela-wrap::-webkit-scrollbar{width:6px}.tabela-wrap::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:3px}table{width:100%;border-collapse:collapse;table-layout:fixed}thead th{background:#0a0a0a;padding:8px 12px;text-align:left;font-size:11px;font-weight:400!important;color:#bbb!important;text-transform:uppercase;letter-spacing:0;position:sticky;top:0;z-index:1;border-bottom:1px solid #1e1e1e;white-space:nowrap}thead th.th-center{text-align:center}thead th.th-right{text-align:right}tbody td{padding:7px 12px;border-bottom:1px solid #303030;font-size:13px;color:#d0d0d0;vertical-align:middle}tbody tr:last-child td{border-bottom:none}tbody tr:nth-child(2n) td{background:rgba(255,255,255,.035)}tbody tr:hover td{background:#263038}.td-codigo{font-family:monospace;font-weight:700;color:#7ecfda;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.th-codigo{width:190px}.th-estoque{width:70px}.th-movimento{width:90px}.th-os{width:120px}.td-os{font-family:monospace;font-size:12px;color:#f0a500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.th-quantidade{width:90px}.th-usuario{width:140px}.th-data{width:130px}.td-local{font-family:monospace;font-weight:700;color:#f0a500;white-space:nowrap}.td-qtde{text-align:right;font-weight:700;font-family:monospace}.td-data{white-space:nowrap;color:#888;font-size:12px}.td-usuario{color:#aaa;font-size:12px;white-space:nowrap}.td-desc{color:#bbb;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.td-center{text-align:center}.badge-tipo{display:inline-block;padding:2px 9px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.4px;white-space:nowrap}.badge-entrada{background:#0b2116;border:1px solid #1a4030;color:#4db870}.badge-saida{background:#200a0a;border:1px solid #3a1010;color:#e05050}.qtde-entrada{color:#4db870}.qtde-saida{color:#e05050}.empty-state{text-align:center;padding:60px;color:#333;font-size:14px}.loading-row td{text-align:center;padding:40px;color:#444;font-size:13px;font-style:italic}</style><div class="header"><div class="logo"><img src="LOGO.png" alt="TAG"></div><div class="titulo">ERP | Sistema de Gestão TAG</div><div style="position:absolute;right:20px;display:flex;align-items:center;gap:12px"><span style="font-size:20px">👤</span> <span id="nome-usuario" style="color:#e5e5e5;font-size:14px"></span> <button type="button" class="btn btn-teal" onclick='window.location.href="menu.html"' onmouseover='this.style.background="#009ab0"' onmouseout='this.style.background="#007a8c"'>🏠 Menu Principal</button></div></div><main><div class="filtros-bar"><div class="filtro-grupo"><label>Buscar</label> <input type="text" id="filtro-busca" class="input-filtro input-filtro-busca" placeholder="Código ou descrição..." oninput="filtrar()"></div><div class="divisor"></div><div class="filtro-grupo"><label>De</label><div style="position:relative;display:inline-flex;align-items:center"><input type="date" id="filtro-de" class="input-filtro input-filtro-data" title="Data inicial" onchange="filtrar()" onclick="this.showPicker&&this.showPicker()" style="padding-right:26px"> <span style="position:absolute;right:7px;font-size:12px;color:#8b949e;pointer-events:none">📅</span></div></div><div class="filtro-grupo"><label>Até</label><div style="position:relative;display:inline-flex;align-items:center"><input type="date" id="filtro-ate" class="input-filtro input-filtro-data" title="Data final" onchange="filtrar()" onclick="this.showPicker&&this.showPicker()" style="padding-right:26px"> <span style="position:absolute;right:7px;font-size:12px;color:#8b949e;pointer-events:none">📅</span></div></div><div class="divisor"></div><div class="filtro-grupo"><label>Movimento</label> <select id="filtro-tipo" class="input-filtro input-filtro-tipo" title="Tipo de movimento" onchange="filtrar()"><option value="">Todos<option value="ENTRADA">Entradas<option value="SAIDA">Saídas</select></div><div class="filtro-grupo"><label>Estoque</label> <input type="text" id="filtro-local" class="input-filtro input-filtro-local" placeholder="Ex: ST-001..." oninput="filtrar()"></div></div><div class="totais-bar"><div class="total-chip total-entradas">▲ Entradas <span class="total-num" id="tot-entradas">—</span></div><div class="total-chip total-saidas">▼ Saídas <span class="total-num" id="tot-saidas">—</span></div><div class="total-chip total-registros">Registros <span class="total-num" id="tot-registros">—</span></div></div><div class="tabela-wrap"><table><thead><tr><th class="th-codigo">Código<th class="th-desc">Descrição<th class="th-estoque">Estoque<th class="th-center th-movimento">Movimento<th class="th-os">O.S.<th class="th-right th-quantidade">Quantidade<th class="th-usuario">Usuário<th class="th-data">Data / Hora<tbody id="tbody-historico"><tr class="loading-row"><td colspan="8">Carregando...</table></div></main><div id="toast" class="toast"></div><script src="supabase.min.js"></script><script src="erp.js"></script><script>let registros=[];document.getElementById("nome-usuario").textContent=sessionStorage.getItem("erp_usuario_nome")||"";const hoje=(new Date).toISOString().split("T")[0];async function carregarDados(){document.getElementById("tbody-historico").innerHTML='<tr class="loading-row"><td colspan="8">Carregando...</td></tr>';try{const[t,e]=await Promise.all([db.from("estoque_entradas").select("id, codigo, descricao, local_estoque, quantidade, usuario_nome, created_at").order("created_at",{ascending:!1}).limit(2e3),db.from("estoque_saidas").select("id, codigo, descricao, local_estoque, quantidade, usuario_nome, numero_os, created_at").order("created_at",{ascending:!1}).limit(2e3)]);if(t.error)throw t.error;if(e.error)throw e.error;const o=(t.data||[]).map(t=>({...t,tipo:"ENTRADA"})),a=(e.data||[]).map(t=>({...t,tipo:"SAIDA"}));registros=[...o,...a].sort((t,e)=>new Date(e.created_at)-new Date(t.created_at)),filtrar()}catch(t){console.error(t),mostrarToast("Erro ao carregar histórico: "+t.message,"error"),document.getElementById("tbody-historico").innerHTML='<tr class="loading-row"><td colspan="8">Erro ao carregar dados.</td></tr>'}}function filtrar(){const t=document.getElementById("filtro-busca").value.trim().toUpperCase(),e=document.getElementById("filtro-tipo").value,o=document.getElementById("filtro-de").value,a=document.getElementById("filtro-ate").value,r=document.getElementById("filtro-local").value.trim().toUpperCase();renderizar(registros.filter(n=>!(t&&!n.codigo?.toUpperCase().includes(t)&&!n.descricao?.toUpperCase().includes(t))&&((!e||n.tipo===e)&&(!(r&&!n.local_estoque?.toUpperCase().includes(r))&&(!(o&&n.created_at.substring(0,10)<o)&&!(a&&n.created_at.substring(0,10)>a))))))}function renderizar(t){const e=document.getElementById("tbody-historico");let o=0,a=0;if(!t.length)return e.innerHTML='<tr><td colspan="8" class="empty-state">Nenhum registro encontrado.</td></tr>',void atualizarTotais(0,0,0);e.innerHTML=t.map(t=>{const e="ENTRADA"===t.tipo;e?o++:a++;const r=e?'<span class="badge-tipo badge-entrada">▲ ENTRADA</span>':'<span class="badge-tipo badge-saida">▼ SAÍDA</span>',n=e?"qtde-entrada":"qtde-saida",s=e?"+":"−",d=Number(t.quantidade).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}),i=formatarDataHora(t.created_at);return`<tr>\n        <td class="td-codigo">${t.codigo||"—"}</td>\n        <td class="td-desc" title="${t.descricao||""}">${t.descricao||"—"}</td>\n        <td class="td-local">${t.local_estoque||"—"}</td>\n        <td class="td-center">${r}</td>\n        <td class="td-os">${t.numero_os||"—"}</td>\n        <td class="td-qtde ${n}">${s} ${d}</td>\n        <td class="td-usuario">${t.usuario_nome||"—"}</td>\n        <td class="td-data">${i}</td>\n      </tr>`}).join(""),atualizarTotais(o,a,t.length)}function atualizarTotais(t,e,o){document.getElementById("tot-entradas").textContent=t,document.getElementById("tot-saidas").textContent=e,document.getElementById("tot-registros").textContent=o}function formatarDataHora(t){if(!t)return"—";const e=new Date(t);return e.toLocaleDateString("pt-BR")+" "+e.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}function mostrarToast(t,e){const o=document.getElementById("toast");o.textContent=t,o.className=`toast toast-${e} show`,setTimeout(()=>o.classList.remove("show"),3500)}document.getElementById("filtro-ate").value=hoje,carregarDados()</script>
