<!DOCTYPE html><html lang="pt-br"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lista de Pedidos | ERP TAG</title><link rel="stylesheet" href="erp.css"><style>.toast{position:fixed;bottom:20px;right:20px;padding:10px 18px;border-radius:8px;font-size:13px;color:#fff;z-index:999;opacity:0;transform:translateY(8px);transition:all .3s}.toast.show{opacity:1;transform:translateY(0)}.toast-error{background:#7f1d1d;border:1px solid #ef4444}.toast-success{background:#166534;border:1px solid #22c55e}.sec-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.sec-header h1{font-size:16px;color:#fff}.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.form-control{background:#111;border:1px solid #2a2a2a;color:#e5e5e5;border-radius:6px;padding:6px 9px;font-size:12px}.form-control:focus{outline:0;border-color:#007a8c}.btn{padding:6px 14px;border:none;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}.btn-teal{background:#007a8c;color:#fff}.btn-teal:hover{background:#009ab0}.btn-ghost{background:0 0;color:#aaa;border:1px solid #333}.btn-ghost:hover{border-color:#555;color:#fff}.panel{background:#141414;border:1px solid #1f1f1f;border-radius:8px;flex:0 0 auto;display:flex;flex-direction:column;overflow:hidden;max-width:980px;width:100%;margin:0 auto}.table-wrap{overflow:visible}table{width:100%;border-collapse:collapse;min-width:820px}thead th{position:sticky;top:0;z-index:2;background:#0a0a0a;color:#b8c0c8!important;padding:7px 12px;font-size:11px;font-weight:400!important;text-align:left;text-transform:uppercase}thead th.text-center{text-align:center}thead th.text-right{text-align:right}tbody td{border-bottom:1px solid #1f1f1f;color:#c8c8c8;padding:6px 12px;font-size:12px;vertical-align:middle}tbody tr:nth-child(odd) td{background:#101010}tbody tr:nth-child(2n) td{background:rgba(255,255,255,.035)}tbody tr:hover td{background:#263038}.text-center{text-align:center}.text-right{text-align:right}.tipo-tri{display:inline-flex;align-items:center;justify-content:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:400;background:rgba(124,58,237,.14);color:#c4b5fd;border:1px solid rgba(124,58,237,.35)}.tipo-nao{display:inline-flex;align-items:center;justify-content:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:400;background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.3)}.empty{color:#555;text-align:center;padding:50px 20px;font-size:13px}.num-pedido{font-family:monospace;font-size:12px;font-weight:400;color:#7ecfda}.total-val{font-family:monospace;font-size:12px;font-weight:400;color:#4ade80}.delete-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:15px;color:#ef4444;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);transition:all .15s}.delete-btn:hover{background:rgba(239,68,68,.22);color:#fff}.lock-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:7px;cursor:pointer;font-size:18px;color:#4ade80;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);transition:all .15s}.lock-btn:hover{background:rgba(74,222,128,.2)}.lock-btn.bloqueado{color:#f87171;background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.35)}.lock-btn.bloqueado:hover{background:rgba(248,113,113,.22)}.switch{position:relative;display:inline-block;width:32px;height:18px;flex-shrink:0}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#2a2a2a;border:1px solid #444;border-radius:18px;transition:.2s}.slider:before{position:absolute;content:"";height:12px;width:12px;left:2px;bottom:2px;background:#666;border-radius:50%;transition:.2s}input:checked+.slider{background:#007a8c;border-color:#007a8c}input:checked+.slider:before{transform:translateX(14px);background:#fff}</style><div class="header"><div class="logo"><img src="LOGO.png" alt="TAG"></div><div class="titulo">ERP | Sistema de Gestão TAG</div><div style="position:absolute;right:20px;display:flex;align-items:center;gap:12px"><span style="font-size:20px">👤</span> <span id="nome-usuario" style="color:#e5e5e5;font-size:14px"></span> <button type="button" class="btn btn-teal" onclick='window.location.href="menu.html"'>🏠 Menu Principal</button></div></div><main style="padding:76px 20px 26px;min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column"><div class="sec-header"><h1>🛍️ Pedidos de Compra - Visão Geral</h1><div class="filters"><input type="text" id="filtro-busca" class="form-control" placeholder="Buscar pedido, fornecedor, solicitante..." style="width:300px" oninput="aplicarFiltros()"> <select id="filtro-tri" class="form-control" title="Filtrar por tipo" onchange="aplicarFiltros()"><option value="TODOS">Normal + Triangulação<option value="NAO">Apenas Normal<option value="SIM">Apenas Triangulação</select></div></div><section class="panel"><div class="table-wrap" id="table-wrap"><div class="empty">Carregando pedidos...</div></div></section></main><div class="toast" id="toast"></div><script src="supabase.min.js"></script><script src="erp.js"></script><script>let todos=[],filtrados=[];function mostrarToast(t,e){const o=document.getElementById("toast");o.textContent=t,o.className=`toast toast-${e} show`,setTimeout(()=>o.classList.remove("show"),4e3)}function fmt(t){return Number(t||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}async function carregar(){document.getElementById("table-wrap").innerHTML='<div class="empty">Carregando pedidos...</div>';const{data:t,error:e}=await db.from("compras_pedidos").select("id, numero_pedido, solicitante, fornecedor_nome, triangulacao, total_geral, ativo, bloqueado, created_at").order("id",{ascending:!1});if(e)return mostrarToast("Erro ao carregar pedidos: "+e.message,"error"),void(document.getElementById("table-wrap").innerHTML='<div class="empty">Erro ao carregar dados.</div>');todos=t||[],aplicarFiltros()}function aplicarFiltros(){const t=(document.getElementById("filtro-busca").value||"").toLowerCase(),e=document.getElementById("filtro-tri").value;filtrados=todos.filter(o=>!("SIM"===e&&!o.triangulacao)&&(("NAO"!==e||!o.triangulacao)&&!(t&&![o.numero_pedido,o.solicitante,o.fornecedor_nome].join(" ").toLowerCase().includes(t)))),renderTabela()}function renderTabela(){const t=document.getElementById("table-wrap");filtrados.length?t.innerHTML=`\n    <table>\n      <thead>\n        <tr>\n          <th style="width:52px;" class="text-center">Ativo</th>\n          <th style="width:130px;">Item</th>\n          <th style="width:240px;">Solicitante</th>\n          <th style="width:180px;">Fornecedor</th>\n          <th style="width:130px;" class="text-center">Tipo</th>\n          <th style="width:160px;" class="text-right">Valor Total</th>\n          <th style="width:54px;" class="text-center">Excluir</th>\n          <th style="width:50px;" class="text-center">Edição</th>\n        </tr>\n      </thead>\n      <tbody>\n        ${filtrados.map(t=>`\n          <tr style="opacity:${!1===t.ativo?"0.45":"1"};">\n            <td class="text-center">\n              <label class="switch" title="${!1===t.ativo?"Ativar pedido":"Desativar pedido"}">\n                <input type="checkbox" ${!1!==t.ativo?"checked":""} onchange="toggleAtivo(${t.id}, this.checked)">\n                <span class="slider"></span>\n              </label>\n            </td>\n            <td><span class="num-pedido">${esc(t.numero_pedido||"-")}</span></td>\n            <td style="white-space:nowrap;">${esc(t.solicitante||"-")}</td>\n            <td>${esc(t.fornecedor_nome||"-")}</td>\n            <td class="text-center">\n              ${t.triangulacao?'<span class="tipo-tri">Triangulação</span>':'<span class="tipo-nao">Normal</span>'}\n            </td>\n            <td class="text-right"><span class="total-val">R$ ${fmt(t.total_geral)}</span></td>\n            <td class="text-center">\n              ${t.bloqueado?"":`<button type="button" class="delete-btn" title="Excluir pedido" onclick="excluirPedido(${t.id})">&#128465;</button>`}\n            </td>\n            <td class="text-center">\n              <span class="lock-btn ${t.bloqueado?"bloqueado":""}" title="${t.bloqueado?"Pedido bloqueado para edição — clique para desbloquear":"Pedido liberado para edição — clique para bloquear"}" onclick="toggleBloqueio(${t.id}, ${!t.bloqueado})">${t.bloqueado?"🔒":"🔓"}</span>\n            </td>\n          </tr>`).join("")}\n      </tbody>\n    </table>`:t.innerHTML='<div class="empty">Nenhum pedido encontrado.</div>'}async function excluirPedido(t){const e=todos.find(e=>e.id===t);if(!e)return;if(e.bloqueado)return void mostrarToast("Pedido bloqueado. Desbloqueie antes de excluir.","error");const o=e.numero_pedido||"este pedido";if(!await confirmar(`Excluir o pedido "${o}" do banco de dados?\n\nOs itens vinculados também serão removidos.`,"Excluir Pedido","danger"))return;const{error:a}=await db.from("compras_pedidos").delete().eq("id",t);if(a)return mostrarToast("Erro ao excluir pedido: "+a.message,"error");todos=todos.filter(e=>e.id!==t),mostrarToast("Pedido excluído com sucesso.","success"),aplicarFiltros()}async function toggleAtivo(t,e){const{error:o}=await db.from("compras_pedidos").update({ativo:e}).eq("id",t);if(o)return mostrarToast("Erro ao atualizar pedido: "+o.message,"error"),void carregar();const a=todos.find(e=>e.id===t);a&&(a.ativo=e),aplicarFiltros()}async function toggleBloqueio(t,e){const{error:o}=await db.from("compras_pedidos").update({bloqueado:e}).eq("id",t);if(o)return mostrarToast("Erro ao atualizar bloqueio: "+o.message,"error"),void carregar();const a=todos.find(e=>e.id===t);a&&(a.bloqueado=e),mostrarToast(e?"Pedido bloqueado para edição.":"Pedido liberado para edição.","success"),aplicarFiltros()}function esc(t){return String(t??"").replace(/[&<>"']/g,t=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[t]))}sessionStorage.getItem("erp_usuario_id")?(document.getElementById("nome-usuario").textContent=sessionStorage.getItem("erp_usuario_nome")||"",carregar())</script>
