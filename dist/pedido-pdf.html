<!DOCTYPE html><html lang="pt-br"><meta charset="UTF-8"><title>Pedido de Compras</title><style>@page{size:A4 landscape;margin:10mm 12mm 10mm 12mm;@bottom-right{content:"Página " counter(page) " de " counter(pages);font-size:7pt;color:#888}}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;font-size:8.5pt;color:#000;background:#d9d9d9;margin:0;padding:12mm 0}.hdr{position:relative;display:block;padding:4px 0 6px;border-bottom:3px solid #007a8c;margin:-1mm 0 4mm}.hdr-logo{margin-bottom:6px}.hdr-logo img{height:55px;width:auto;margin-top:0}.hdr-info{display:flex;flex-direction:column;gap:2px}.hdr-nome{font-size:11pt;font-weight:700;color:#004a56;line-height:1.2}.hdr-det{font-size:7.5pt;color:#555;line-height:1.4}.hdr-doc{position:absolute;top:4px;right:0;width:250px;text-align:right;display:flex;flex-direction:column;gap:2px}.doc-t{font-size:12pt;font-weight:700;color:#007a8c;letter-spacing:1px;margin:0}.doc-n{font-size:18pt;font-weight:700;color:#004a56;margin:0}.doc-d{font-size:8pt;color:#666;margin-top:3px}.sec{background:#f0f8fa;border:1.5px solid #a8d4de;border-radius:4px;padding:6px 10px;margin-bottom:5px}.sec-t{font-size:7.5pt;font-weight:700;color:#004a56;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;padding-bottom:4px;border-bottom:1.5px solid #a8d4de}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-top:6px}.c-lbl{font-size:7pt;font-weight:700;color:#007a8c;text-transform:uppercase;display:block;margin-bottom:2px;letter-spacing:.3px}.c-val{font-size:8.5pt;font-weight:400;color:#111;word-break:break-word}.trig-row{display:flex;align-items:center;gap:6px}.trig-badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:7.5pt;font-weight:700}.trig-nao{background:#e8f4ea;color:#2d7a3a;border:1px solid #8ec99a}.trig-sim{background:#fef3e2;color:#9a5a00;border:1px solid #f0c060}table{width:100%;border-collapse:collapse;font-size:7.5pt;margin-top:5mm}thead th{background:#007a8c;color:#fff;padding:5px 6px;text-align:left;font-size:7pt;font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;border-bottom:2px solid #005a68}tbody tr:nth-child(odd) td{background:#f0f8fb}tbody tr:nth-child(2n) td{background:#fff}tbody td{padding:4px 6px;border-bottom:1px solid #cce4ea;color:#222}.c{text-align:center}.r{text-align:right}.b{font-weight:400;color:#004a56}.totais{display:flex;justify-content:flex-end;gap:20px;background:#004a56;color:#fff;padding:6px 12px;border-radius:4px;margin-top:4px}.tot-b{text-align:right}.tot-l{font-size:7pt;color:#7ecfda;text-transform:uppercase;font-weight:700;letter-spacing:.5px}.tot-v{font-size:10.5pt;font-weight:400}.tot-b.dest .tot-v{font-size:13pt;color:#7ecfda}.obs-box{background:#fffbea;border:1.5px solid #e0c840;border-radius:4px;padding:5px 10px;margin-top:5px;margin-bottom:5mm}.obs-lbl{font-size:7pt;font-weight:700;color:#9a7000;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}.obs-txt{font-size:7.5pt;color:#333}.entrega-footer{position:relative;margin-top:0;margin-bottom:0;left:0;right:0;background:#fff;padding:0;border-top:none}.entrega-footer .sec{margin-bottom:0}.rodape{position:absolute;left:12mm;right:12mm;bottom:4mm;display:flex;flex-direction:column;gap:5px;padding:6px 12px 0;background:0 0;z-index:1000}.rodape-linha-info{width:100%}.rodape-linha-user{display:flex;gap:24px;align-items:flex-start;border-top:1px solid #ccc;padding-top:5px;margin-top:3px}.rodape-col{display:flex;flex-direction:column;gap:1px}.rodape-col-lbl{font-size:8pt;font-weight:700;color:#007a8c;line-height:1.3}.rodape-col-val{font-size:10pt;font-weight:400;color:#004a56;line-height:1.2}.rodape-col-sub{font-size:8pt;color:#555;line-height:1.3}.rodape-info{font-size:7.7pt;color:#333;line-height:1.25}.rodape-info .info-t{color:#004a56;font-weight:700}.rodape-direita{margin-left:auto;text-align:right}.rodape-gerado{font-size:8pt;font-weight:400;color:#004a56}.rodape-sistema{font-size:7.5pt;color:#888}.erro{font-family:Arial;font-size:14px;color:#c00;padding:40px;text-align:center}.acoes-pdf{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:2000;display:flex;gap:8px}.acoes-pdf button{border:none;border-radius:5px;padding:8px 12px;background:#007a8c;color:#fff;font-size:12px;font-weight:700;text-transform:none;cursor:pointer}.acoes-pdf button:hover{background:#009ab0}@media print{body{background:#fff;padding:0;print-color-adjust:exact;-webkit-print-color-adjust:exact}.pagina{width:auto;min-height:auto;margin:0;padding:0;box-shadow:none}.rodape{position:fixed}.acoes-pdf{display:none}}</style><body><script src="supabase.min.js"></script><script src="erp.js"></script><script>!async function(){const s=localStorage.getItem("pdf_pedido");if(!s)return void(document.body.innerHTML='<div class="erro">Dados não encontrados. Gere o PDF a partir da tela de Pedidos de Compra.</div>');localStorage.removeItem("pdf_pedido");const a=JSON.parse(s),{data:n}=await db.from("dados_cadastrais").select("*").order("id").limit(1).single(),d=s=>Number(s||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});let t=0,i=0;a.itens.forEach(s=>{const a=s.qtde*s.valor_unitario;t+=a,i+=a*s.ipi_pct/100});const l=a.itens.map((s,a)=>`\n    <tr>\n      <td class="c">${a+1}</td>\n      <td>${s.descricao||"—"}</td>\n      <td>${s.codigo||"—"}</td>\n      <td class="c">${s.unidade_simbolo||"—"}</td>\n      <td class="r">${d(s.qtde)}</td>\n      <td class="r">R$ ${d(s.valor_unitario)}</td>\n      <td class="c">${s.icms_pct||0}%</td>\n      <td class="c">${s.ipi_pct||0}%</td>\n      <td class="r">R$ ${d(s.valor_ipi)}</td>\n      <td class="r b">R$ ${d(s.valor_total)}</td>\n      <td class="c">${(s=>{const a=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);return a?`${a[3]}/${a[2]}/${a[1]}`:s||"—"})(s.data_item)}</td>\n      <td class="c">${s.numero_os||"—"}</td>\n    </tr>`).join(""),o="SIM"===a.triangulacao?"trig-sim":"trig-nao",c=a.observacao?`\n    <div class="obs-box">\n      <div class="obs-lbl">Observação</div>\n      <div class="obs-txt">${a.observacao}</div>\n    </div>`:"",e=a.solicitante?`\n    <div class="rodape-col">\n      <span class="rodape-col-lbl">Solicitante</span>\n      <span class="rodape-col-val">${a.solicitante}</span>\n    </div>`:"<div></div>",r=a.modoConsulta||!a.usuarioNome&&!a.usuarioEmail?"<div></div>":`\n    <div class="rodape-col">\n      <span class="rodape-col-lbl">Gerado por:</span>\n      <span class="rodape-col-val">${a.usuarioNome||""}</span>\n      ${a.usuarioEmail?`<span class="rodape-col-sub">${a.usuarioEmail}</span>`:""}\n    </div>`,v=`\n    <div class="rodape-direita">\n      ${a.modoConsulta?"":`<div class="rodape-gerado">Documento gerado em ${(new Date).toLocaleString("pt-BR")}</div>`}\n      <div class="rodape-sistema">ERP TAG — Sistema de Gestão</div>\n    </div>`;document.body.innerHTML=`\n    <div class="acoes-pdf">\n      <button type="button" onclick="window.print()">Salvar / Imprimir PDF</button>\n      <button type="button" onclick="window.close()">Fechar</button>\n    </div>\n    <div class="pagina">\n    <div class="hdr">\n      <div class="hdr-logo"><img src="logo_2.png" onerror="this.src='LOGO.png';this.onerror=null;" alt="TAG"></div>\n      <div class="hdr-info">\n        <div class="hdr-nome">${n?.razao_social||"TAG INTEGRADORA DE SISTEMAS DE AUTOMAÇÃO INDUSTRIAL LTDA."}</div>\n        <div class="hdr-det">CNPJ: ${n?.cnpj||"—"} &nbsp;|&nbsp; IE: ${n?.insc_estadual||"—"} &nbsp;|&nbsp; IM: ${n?.insc_municipal||"—"}</div>\n        <div class="hdr-det">${n?.end_fat_logradouro||"—"} — CEP ${n?.end_fat_cep||"—"} — ${n?.end_fat_cidade||"—"}/${n?.end_fat_uf||"—"} &nbsp;|&nbsp; Fone: ${n?.end_fat_fone||"—"}</div>\n        <div class="hdr-det">${n?.email||""} ${n?.site?"&nbsp;|&nbsp; "+n.site:""}</div>\n      </div>\n      <div class="hdr-doc">\n        <div class="doc-t">${a.modoConsulta?"PEDIDO DE COMPRAS CONSULTA":"PEDIDO DE COMPRAS"}</div>\n        <div class="doc-n">Nº ${a.numeroPedido}</div>\n      </div>\n    </div>\n\n    <div class="sec">\n      <div class="sec-t">Fornecedor</div>\n      <div class="g3" style="grid-template-columns: 1fr 0.7fr 1.8fr 0.55fr;">\n        <div><span class="c-lbl">Razão Social / Nome Fantasia</span><span class="c-val">${a.fornNome}</span></div>\n        <div><span class="c-lbl">CNPJ</span><span class="c-val">${a.fornCnpj}</span></div>\n        <div><span class="c-lbl">Endereço</span><span class="c-val">${a.fornEnder}</span></div>\n        <div><span class="c-lbl">Tipo Venda</span><span class="c-val">${a.tipoVenda||"—"}</span></div>\n      </div>\n      <div class="g4" style="grid-template-columns: 1fr 0.7fr 1.8fr 0.55fr;">\n        <div><span class="c-lbl">Contato</span><span class="c-val">${a.contato}</span></div>\n        <div><span class="c-lbl">E-mail</span><span class="c-val">${a.email}</span></div>\n        <div><span class="c-lbl">Celular</span><span class="c-val">${a.celular}</span></div>\n        <div><span class="c-lbl">Pagamento</span><span class="c-val">${a.condicao}</span></div>\n      </div>\n    </div>\n\n    \x3c!-- Entrega — após Fornecedor --\x3e\n    <div class="entrega-footer">\n      <div class="sec">\n        <div class="sec-t">Entrega</div>\n        <div class="g3" style="grid-template-columns:80px 1fr 2fr 80px;">\n          <div>\n            <span class="c-lbl">Triangulação</span>\n            <span class="trig-badge ${o}">${a.triangulacao}</span>\n          </div>\n          <div><span class="c-lbl">Local</span><span class="c-val">${a.localNome||"—"}</span></div>\n          <div><span class="c-lbl">Endereço</span><span class="c-val">${a.localEndereco||a.localNome||"—"}</span></div>\n          <div><span class="c-lbl">Tipo de Frete</span><span class="c-val">${a.tipoFrete||"—"}</span></div>\n        </div>\n      </div>\n    </div>\n\n    ${c}\n\n    <table>\n      <thead>\n        <tr>\n          <th style="width:26px;">Item</th>\n          <th>Descrição</th>\n          <th style="width:110px;">Produto</th>\n          <th style="width:34px;" class="c">Un</th>\n          <th style="width:56px;" class="r">Qtde</th>\n          <th style="width:72px;" class="c">Valor<br>Unit.</th>\n          <th style="width:46px;" class="c">ICMS</th>\n          <th style="width:38px;" class="c">IPI</th>\n          <th style="width:66px;" class="c">Valor<br>IPI</th>\n          <th style="width:74px;" class="c">Valor<br>Total</th>\n          <th style="width:76px;" class="c">Previsão<br>Entrega</th>\n          <th style="width:76px;" class="c">O.S.</th>\n        </tr>\n      </thead>\n      <tbody>${l}</tbody>\n    </table>\n\n    <div class="totais">\n      <div class="tot-b"><div class="tot-l">Subtotal Produtos</div><div class="tot-v">R$ ${d(t)}</div></div>\n      <div class="tot-b"><div class="tot-l">Total IPI</div><div class="tot-v">R$ ${d(i)}</div></div>\n      <div class="tot-b dest"><div class="tot-l">Total Geral</div><div class="tot-v">R$ ${d(t+i)}</div></div>\n    </div>\n\n    <div class="rodape">\n      <div class="rodape-linha-info">\n    <div class="rodape-info">\n      <span class="info-t">Informações obrigatórias:</span>\n      Deverão constar em NFe: Data de vencimento do pagamento, quantidade de parcelas,\n      dados bancários e/ou boletos, número do pedido de compras e proposta.\n    </div></div>\n      <div class="rodape-linha-user">\n        ${r}\n        ${e}\n        ${v}\n      </div>\n    </div>\n    </div>\n\n  `}()</script>
