<!DOCTYPE html><html lang="pt-br"><meta charset="UTF-8"><title>Gerar Hash - ERP TAG</title><style>body{background:#000;color:#e5e5e5;font-family:Arial;display:flex;align-items:center;justify-content:center;height:100vh}.box{background:#111;border:1px solid #222;border-radius:10px;padding:30px;width:420px}h2{margin-bottom:20px;font-size:16px;color:#aaa}input{width:100%;padding:10px;background:#222;border:1px solid #333;border-radius:6px;color:#fff;font-size:14px;margin-bottom:12px}button{width:100%;padding:11px;background:#007a8c;border:none;border-radius:6px;color:#fff;font-size:14px;cursor:pointer}.resultado{margin-top:16px;background:#0d2b2b;border:1px solid #1a5c5c;border-radius:6px;padding:12px;font-size:12px;word-break:break-all;color:#4dd9ac}.sql{margin-top:12px;background:#1a1a1a;border:1px solid #333;border-radius:6px;padding:12px;font-size:11px;color:#aaa;word-break:break-all}</style><div class="box"><h2>🔑 Gerador de Hash de Senha</h2><input type="text" id="senha" placeholder="Digite a senha desejada"> <input type="text" id="usuario" placeholder="Nome do usuário (ex: ADMIN)"> <button onclick="gerar()">Gerar Hash</button><div class="resultado" id="hash" style="display:none"></div><div class="sql" id="sql" style="display:none"></div></div><script>async function gerar(){const e=document.getElementById("senha").value,t=document.getElementById("usuario").value.trim().toUpperCase();if(!e||!t)return void alert("Preencha a senha e o usuário!");const n=await crypto.subtle.digest("SHA-256",(new TextEncoder).encode(e)).then(e=>Array.from(new Uint8Array(e)).map(e=>e.toString(16).padStart(2,"0")).join(""));document.getElementById("hash").style.display="block",document.getElementById("hash").textContent="🔐 Hash: "+n,document.getElementById("sql").style.display="block",document.getElementById("sql").textContent=`Cole no Supabase SQL Editor:\n\nUPDATE usuarios SET senha_hash = '${n}' WHERE nome_usuario = '${t}';`}</script>
