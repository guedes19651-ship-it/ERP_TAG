<!DOCTYPE html><html lang="pt-br"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unidades de Medida - ERP TAG</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;font-family:Arial,sans-serif;height:100vh;display:flex;align-items:center;justify-content:center}.popup{background:#000;border:1px solid #1a1a1a;border-radius:10px;width:460px;max-width:95vw;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.8)}.popup-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #1a1a1a}.popup-header h2{font-size:14px;color:#fff}.popup-header .acoes{display:flex;gap:8px;align-items:center}.btn-fechar{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;background:#222!important;border:1px solid #444!important;color:#ccc!important;font-size:16px;cursor:pointer;line-height:1.4;padding:0;border-radius:4px;transition:all .15s}.btn-fechar:hover{border-color:#ef4444!important;color:#ef4444!important;background:#2c0a0a!important}.popup-body{overflow-y:auto;flex:1}table{width:100%;border-collapse:collapse}thead th{background:#0a0a0a;padding:10px 14px;text-align:left;font-size:11px;font-weight:400;color:#fff;text-transform:uppercase;letter-spacing:0;position:sticky;top:0;border-bottom:1px solid #1a1a1a}tbody td{padding:9px 14px;border-bottom:1px solid #303030;font-size:13px;color:#fff}tbody tr:last-child td{border-bottom:none}tbody tr:nth-child(2n) td{background:rgba(255,255,255,.035)}tbody tr:hover td{background:rgba(0,122,140,.08)}.acoes-td{display:flex;gap:6px}.linha-novo td{background:rgba(0,122,140,.08)}.input-inline{width:100%;padding:6px 10px;background:#1a1a1a;border:1px solid #007a8c;border-radius:5px;color:#e5e5e5;font-size:13px;text-transform:uppercase}.input-inline:focus{outline:0;border-color:#4dd9ac}.input-inline::placeholder{text-transform:none;color:#444}.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;white-space:nowrap}.btn-teal{background:#007a8c;color:#fff}.btn-teal:hover{background:#009ab0}.btn-edit{background:rgba(0,122,140,.15);color:#7ecfda;border:1px solid rgba(0,122,140,.3)}.btn-edit:hover{background:#007a8c;color:#fff}.btn-del{background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.2)}.btn-del:hover{background:#ef4444;color:#fff}.btn-ghost{background:0 0;color:#777;border:1px solid #2a2a2a}.btn-ghost:hover{color:#e5e5e5;border-color:#444}.btn-save{background:#22c55e;color:#fff}.btn-save:hover{background:#16a34a}.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;font-size:14px;color:#fff;z-index:999;opacity:0;transform:translateY(10px);transition:all .3s}.toast.show{opacity:1;transform:translateY(0)}.toast-success{background:#166534;border:1px solid #22c55e}.toast-error{background:#7f1d1d;border:1px solid #ef4444}</style><div class="popup"><div class="popup-header"><h2>📐 Unidades de Medida</h2><div class="acoes"><button class="btn btn-teal" onclick="mostrarLinhanovo()">+ Novo</button> <button class="btn-fechar" onclick="fechar()" title="Fechar">✕</button></div></div><div class="popup-body"><table><thead><tr><th style="width:120px">Símbolo<th>Descrição<th style="width:110px">Ações<tbody id="tbody"><tr><td colspan="3" style="text-align:center;padding:30px;color:#444">Carregando...</table></div></div><div class="toast" id="toast"></div><script src="supabase.min.js"></script><script src="erp.js"></script><script>let todos=[],editandoId=null;async function carregar(){const{data:t,error:e}=await db.from("unidades_medida").select("*").order("simbolo");e?toast("Erro ao carregar: "+e.message,"error"):(todos=t||[],renderizar(todos))}function renderizar(t){const e=document.getElementById("tbody");t.length?e.innerHTML=t.map(t=>`\n      <tr id="linha-${t.id}">\n        <td><strong>${t.simbolo}</strong></td>\n        <td>${t.descricao}</td>\n        <td class="acoes-td">\n          <button class="btn btn-edit" onclick="editar(${t.id})" title="Editar">✏️</button>\n          <button class="btn btn-del"  onclick="excluir(${t.id}, '${t.simbolo}')">&#128465;</button>\n        </td>\n      </tr>\n    `).join(""):e.innerHTML='<tr><td colspan="3" style="text-align:center;padding:30px;color:#444">Nenhuma unidade cadastrada</td></tr>'}function mostrarLinhanovo(){const t=document.getElementById("linha-novo");t&&t.remove(),editandoId=null;const e=document.getElementById("tbody"),n=document.createElement("tr");n.id="linha-novo",n.className="linha-novo",n.innerHTML='\n      <td><input type="text" class="input-inline" id="novo-simbolo" placeholder="Ex: KG" maxlength="10"></td>\n      <td><input type="text" class="input-inline" id="novo-descricao" placeholder="Descrição da unidade"></td>\n      <td class="acoes-td">\n        <button class="btn btn-save" onclick="salvarNovo()">💾</button>\n        <button class="btn btn-ghost" onclick="cancelarNovo()">✕</button>\n      </td>\n    ',e.insertBefore(n,e.firstChild),document.getElementById("novo-simbolo").focus()}function cancelarNovo(){const t=document.getElementById("linha-novo");t&&t.remove()}async function salvarNovo(){const t=document.getElementById("novo-simbolo").value.trim().toUpperCase(),e=document.getElementById("novo-descricao").value.trim().toUpperCase();if(!t||!e)return void toast("Preencha símbolo e descrição!","error");const{error:n}=await db.from("unidades_medida").insert({simbolo:t,descricao:e});n?toast("Erro: "+n.message,"error"):(toast("Unidade cadastrada!","success"),cancelarNovo(),carregar())}function editar(t){const e=todos.find(e=>e.id===t);if(!e)return;cancelarNovo();const n=document.getElementById("linha-edit");n&&n.remove(),editandoId?carregar().then(()=>iniciarEdicao(t,e)):iniciarEdicao(t,e)}function iniciarEdicao(t,e){editandoId=t;const n=document.getElementById(`linha-${t}`);n&&(n.id="linha-edit",n.innerHTML=`\n      <td><input type="text" class="input-inline" id="edit-simbolo" value="${e.simbolo}" maxlength="10"></td>\n      <td><input type="text" class="input-inline" id="edit-descricao" value="${e.descricao}"></td>\n      <td class="acoes-td">\n        <button class="btn btn-save" onclick="salvarEdicao(${t})">💾</button>\n        <button class="btn btn-ghost" onclick="carregar()">✕</button>\n      </td>\n    `,document.getElementById("edit-simbolo").focus())}async function salvarEdicao(t){const e=document.getElementById("edit-simbolo").value.trim().toUpperCase(),n=document.getElementById("edit-descricao").value.trim().toUpperCase();if(!e||!n)return void toast("Preencha símbolo e descrição!","error");const{error:o}=await db.from("unidades_medida").update({simbolo:e,descricao:n}).eq("id",t);o?toast("Erro: "+o.message,"error"):(toast("Unidade atualizada!","success"),editandoId=null,carregar())}async function excluir(t,e){if(!await confirmar(`Excluir a unidade "${e}"?`))return;const{error:n}=await db.from("unidades_medida").delete().eq("id",t);n?toast("Erro: "+n.message,"error"):(toast("Unidade excluída!","success"),carregar())}function fechar(){window.location.href="menu.html"}function toast(t,e){const n=document.getElementById("toast");n.textContent=t,n.className=`toast toast-${e} show`,setTimeout(()=>n.classList.remove("show"),3e3)}document.addEventListener("keydown",t=>{"Escape"===t.key&&fechar()}),carregar()</script>
